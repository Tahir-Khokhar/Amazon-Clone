{% extends 'frontend/base.html' %}

{% block content %}
<div class="min-h-screen flex flex-col">
    <section class="bg-gradient-to-r from-orange-400 to-orange-600 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">Welcome Back</h1>
            <p class="text-lg opacity-90">Sign in to your Amazon Clone account</p>
        </div>
    </section>
    <section class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="max-w-md mx-auto bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email or Username</label>
                    <input type="text" name="identifier" id="loginIdentifier" required autocomplete="username" class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" id="loginPassword" required autocomplete="current-password" class="input-field">
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" name="remember_me" id="loginRememberMe" class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500">
                        <span class="ml-2 text-sm text-gray-600">Remember Me</span>
                    </label>
                    <a href="#" class="text-sm text-orange-600 hover:underline">Forgot password?</a>
                </div>
                <div id="loginAlert" class="hidden alert alert-error text-center"></div>
                <button type="submit" id="loginBtn" class="w-full btn-primary">Sign In</button>
            </form>
            <p class="mt-6 text-center text-gray-600 text-sm">Don't have an account? <a href="/register" class="text-orange-500 hover:underline font-medium">Create your Amazon Clone account</a></p>
        </div>
    </section>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var form = e.target;
        var data = {
            identifier: form.identifier.value,
            password: form.password.value
        };
        var rememberMe = form.remember_me.checked;
        var btn = document.getElementById('loginBtn');
        var alertEl = document.getElementById('loginAlert');
        alertEl.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
            var headers = {'Content-Type': 'application/json'};
            if (rememberMe) {
                headers['X-Remember-Me'] = 'true';
            }
            var res = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            });
            var result = await res.json();
            if (res.ok) {
                localStorage.setItem('access_token', result.access);
                localStorage.setItem('refresh_token', result.refresh);
                window.location.href = '/';
            } else {
                var messages = [];
                if (result.detail) messages.push(result.detail);
                if (result.message) messages.push(result.message);
                for (var key in result) {
                    if (key === 'detail' || key === 'message') continue;
                    if (Array.isArray(result[key])) {
                        messages.push(result[key].join(', '));
                    } else {
                        messages.push(String(result[key]));
                    }
                }
                alertEl.textContent = messages.join(' ') || 'Login failed';
                alertEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        } catch (err) {
            alertEl.textContent = 'Network error. Please try again.';
            alertEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
{% endblock %}
