{% extends 'frontend/base.html' %}

{% block content %}
<section class="bg-gradient-to-r from-orange-400 to-orange-600 text-white py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-bold">Contact Us</h1>
        <p class="text-orange-100 mt-1">Get in touch with our support team</p>
    </div>
</section>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-xl shadow-sm p-8">
        <div id="loginPrompt" class="hidden text-center">
            <p class="text-gray-600 mb-4">Please log in to contact support.</p>
            <a href="/login" class="inline-block btn-primary">Sign In</a>
        </div>
        <form id="contactForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <input type="text" name="subject" required class="input-field">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea name="message" rows="6" required class="input-field"></textarea>
            </div>
            <button type="submit" class="w-full btn-primary">Submit Ticket</button>
            <p id="contactStatus" class="text-sm hidden"></p>
        </form>
    </div>
</section>

<script>
function getAuthHeaders() {
    const t = localStorage.getItem('access_token');
    return t ? { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' } : {};
}

document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {
        subject: form.subject.value,
        message: form.message.value,
    };
    const statusEl = document.getElementById('contactStatus');
    statusEl.classList.remove('hidden', 'text-green-600', 'text-red-500');
    statusEl.classList.add('text-gray-500');
    statusEl.textContent = 'Submitting...';

    try {
        const res = await fetch('/api/support/tickets/', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
            statusEl.textContent = 'Support ticket submitted successfully! We will get back to you soon.';
            statusEl.classList.remove('text-gray-500', 'text-red-500');
            statusEl.classList.add('text-green-600');
            form.reset();
        } else {
            statusEl.textContent = result.detail || result.message || 'Failed to submit ticket.';
            statusEl.classList.remove('text-gray-500', 'text-green-600');
            statusEl.classList.add('text-red-500');
        }
    } catch (err) {
        statusEl.textContent = 'Network error. Please try again.';
        statusEl.classList.remove('text-gray-500', 'text-green-600');
        statusEl.classList.add('text-red-500');
    }
});
</script>
{% endblock %}
