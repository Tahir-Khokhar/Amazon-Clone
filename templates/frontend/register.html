{% extends 'frontend/base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen flex flex-col">
    <section class="bg-gradient-to-r from-orange-400 to-orange-600 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">Create Account</h1>
            <p class="text-lg opacity-90">Join Amazon Clone and start shopping</p>
        </div>
    </section>
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="max-w-4xl mx-auto bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
            <form id="registerForm" class="space-y-8">

                <div>
                    <h5 class="text-lg font-semibold text-gray-900 mb-4">Personal Information</h5>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" name="full_name" required class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" name="email" required class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" name="username" required class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" name="password" required minlength="8" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                            <input type="password" name="confirm_password" required minlength="8" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                            <input type="text" name="phone" class="input-field">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                        <textarea name="address" rows="3" class="input-field"></textarea>
                    </div>
                </div>

                <hr class="border-gray-200">

                <div>
                    <h5 class="text-lg font-semibold text-gray-900 mb-4">Additional Info</h5>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                            <input type="date" name="dob" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                            <select name="gender" class="input-field">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Occupation</label>
                            <input type="text" name="occupation" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Profile Photo</label>
                            <input type="file" name="profile_photo" class="input-field">
                        </div>
                    </div>
                </div>

                <div id="registerAlert" class="hidden alert alert-error text-center"></div>

                <button type="submit" id="registerBtn" class="w-full btn-primary">Register</button>
                <p class="mt-4 text-center text-gray-600">Already have an account? <a href="/login" class="text-orange-500 hover:underline">Sign In</a></p>
            </form>
        </div>
    </section>
</div>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const data = new FormData(form);
        const btn = document.getElementById('registerBtn');
        const alertEl = document.getElementById('registerAlert');
        alertEl.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        try {
            const res = await fetch('/api/auth/register/', {
                method: 'POST',
                body: data
            });
            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('access_token', result.access);
                localStorage.setItem('refresh_token', result.refresh);
                if (result.user) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                }
                alertEl.textContent = result.message || 'Registration successful!';
                alertEl.classList.remove('hidden', 'alert-error');
                alertEl.classList.add('alert-success');
                setTimeout(() => { window.location.href = '/'; }, 1000);
            } else {
                let messages = [];
                if (result.detail) {
                    messages.push(result.detail);
                }
                if (result.message) {
                    messages.push(result.message);
                }
                for (const [key, val] of Object.entries(result)) {
                    if (key === 'detail' || key === 'message' || key === 'user' || key === 'access' || key === 'refresh') continue;
                    if (Array.isArray(val)) {
                        messages.push(...val);
                    } else {
                        messages.push(String(val));
                    }
                }
                alertEl.textContent = messages.join(' ') || 'Registration failed';
                alertEl.classList.remove('hidden', 'alert-success');
                alertEl.classList.add('alert-error');
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        } catch (err) {
            alertEl.textContent = 'Network error. Please try again.';
            alertEl.classList.remove('hidden', 'alert-success');
            alertEl.classList.add('alert-error');
            btn.disabled = false;
            btn.textContent = 'Register';
        }
    });
</script>
{% endblock %}
