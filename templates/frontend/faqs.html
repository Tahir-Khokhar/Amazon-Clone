{% extends 'frontend/base.html' %}

{% block content %}
<section class="bg-gradient-to-r from-orange-400 to-orange-600 text-white py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-bold">Frequently Asked Questions</h1>
        <p class="text-orange-100 mt-1">Quick answers to common questions</p>
    </div>
</section>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="faqContainer" class="space-y-4">
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
            <p class="text-gray-500">Loading FAQs...</p>
        </div>
    </div>
</section>

<script>
async function loadFAQs() {
    try {
        const res = await fetch('/api/support/faqs/');
        if (!res.ok) throw new Error('Failed to load FAQs');
        const faqs = await res.json();
        const container = document.getElementById('faqContainer');
        if (faqs.length === 0) {
            container.innerHTML = '<p class="text-gray-500">No FAQs available yet.</p>';
            return;
        }
        container.innerHTML = faqs.map(faq => `
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 hover:shadow-md transition-shadow">
                <h3 class="text-lg font-semibold text-gray-900 mb-2">${faq.question}</h3>
                <p class="text-gray-700">${faq.answer}</p>
            </div>
        `).join('');
    } catch (err) {
        document.getElementById('faqContainer').innerHTML = '<p class="text-red-500">Could not load FAQs. Please try again later.</p>';
    }
}
document.addEventListener('DOMContentLoaded', loadFAQs);
</script>
{% endblock %}
